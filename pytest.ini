#
# Unit tests for the CE Python services.
#
# rootdir is pinned here so a checkout nested inside another repository does not
# inherit that repository's pytest.ini — which is how the first run of these
# tests failed with "unrecognized arguments: --cov=src/python/api".
#
# These tests must not need a running stack: no Mongo, no Vault, no broker. Load
# the module under test by path (see tests/unit/test_timefmt.py) rather than
# importing the api package, which pulls in Flask and its config.
#
# They live beside the api package, not inside it: the Dockerfile does
# `COPY ./api/ ./api/`, so tests under api/ would ship in the production image.

[pytest]
testpaths = services/api/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q
